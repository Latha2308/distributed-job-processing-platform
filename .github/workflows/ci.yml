name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobprocessing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Black (formatting check)
      run: black --check app tests

    - name: Run Flake8 (linting)
      run: flake8 app tests --max-line-length=100 --extend-ignore=E203,W503

    - name: Run MyPy (type checking)
      run: mypy app

    - name: Run tests with pytest
      env:
        SECRET_KEY: test-secret-key-at-least-32-characters-long-for-ci-environment
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jobprocessing_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
        DEBUG: false
        USE_SQS: false
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term -v
